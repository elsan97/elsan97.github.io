<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Центральный Раздатчик Файлов elsan97</title>
    <style>
        :root {
            --bg-color: #050806;
            --container-bg: #0d1310;
            --accent-color: #00ff66;
            --text-color: #e0e0e0;
            --text-muted: #55665c;
            --border-color: #16261c;
            --card-bg: rgba(16, 26, 20, 0.4);
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .hub-container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 26px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .repo-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .repo-card {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            transition: all 0.2s ease;
        }

        .repo-card:hover {
            border-color: var(--accent-color);
            box-shadow: 0 5px 15px rgba(0, 255, 102, 0.03);
        }

        .repo-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .repo-desc {
            font-size: 13px;
            color: #a0b0a6;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        .btn-secondary {
            color: #a0b0a6;
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #a0b0a6;
            color: var(--bg-color);
            box-shadow: none;
        }

        .btn-release {
            color: #ffcc00;
            border-color: #ffcc00;
        }
        .btn-release:hover {
            background-color: #ffcc00;
            color: #000;
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
        }

        .status {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="hub-container">
    <h1>FILE HUB // elsan97</h1>
    <div class="subtitle">> Индексация профиля успешна. Доступ к прямым загрузкам всех активных репозиториев.</div>

    <div id="repo-list" class="repo-grid">
        <div class="status">Опрос серверов GitHub и сборка манифестов...</div>
    </div>
</div>

<script>
    const USERNAME = 'elsan97';
    const grid = document.getElementById('repo-list');

    async function initHub() {
        try {

            const res = await fetch(`https://github.com/{USERNAME}/repos?sort=updated&per_page=100`);
            if (!res.ok) throw new Error('Ошибка связи с GitHub');
            const repos = await res.json();

            const filteredRepos = repos.filter(r => r.name.toLowerCase() !== `${USERNAME}.github.io`.toLowerCase());

            if (filteredRepos.length === 0) {
                grid.innerHTML = '<div class="status">Публичные файловые архивы не найдены.</div>';
                return;
            }

            grid.innerHTML = ''; // Очищаем статус


            for (const repo of filteredRepos) {
                const card = document.createElement('div');
                card.className = 'repo-card';


                const desc = repo.description ? repo.description : 'Описания проекта не предоставлено.';
                

                const mainZipUrl = `https://github.com/{USERNAME}/${repo.name}/archive/refs/heads/${repo.default_branch}.zip`;

                card.innerHTML = `
                    <div class="repo-title">📦 ${repo.name}</div>
                    <p class="repo-desc">${desc}</p>
                    <div class="btn-group">
                        <a href="${mainZipUrl}" class="btn" download>Скачать ZIP (${repo.default_branch})</a>
                        <span id="rel-${repo.name}"></span>
                        <a href="${repo.html_url}" target="_blank" class="btn btn-secondary">Исходный код</a>
                    </div>
                `;
                grid.appendChild(card);


                checkReleases(repo.name);
            }

        } catch (err) {
            grid.innerHTML = `<div class="status" style="color: #ff3333;">Критический сбой индексации: ${err.message}</div>`;
        }
    }

    async function checkReleases(repoName) {
        try {
            const res = await fetch(`https://github.com/{USERNAME}/${repoName}/releases/latest`);
            if (res.ok) {
                const release = await res.json();
                const container = document.getElementById(`rel-${repoName}`);
                if (container && release.zipball_url) {
                                       container.innerHTML = `<a href="${release.html_url}" target="_blank" class="btn btn-release">Релиз ${release.name || release.tag_name}</a>`;
                }
            }
        } catch (e) {
           
        }
    }

    initHub();
</script>

</body>
</html>
