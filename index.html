<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровой Архив Архивариуса elsan97</title>
    <style>
        :root {
            --bg-color: #0a0f0d;
            --container-bg: #111814;
            --accent-color: #00ff66;
            --text-color: #e0e0e0;
            --text-muted: #708075;
            --border-color: #1f3326;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .archive-container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 255, 102, 0.05);
        }

        h1 {
            color: var(--accent-color);
            font-size: 24px;
            margin-top: 0;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .description {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        .file-item:hover {
            border-color: var(--accent-color);
            background: rgba(0, 255, 102, 0.02);
        }

        .file-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-name {
            font-weight: bold;
            color: var(--text-color);
            word-break: break-all;
        }

        .file-size {
            font-size: 11px;
            color: var(--text-muted);
        }

        .download-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .status {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="archive-container">
    <h1>📂 Репозиторий-Раздатчик</h1>
    <p class="description">> Автоматический индекс файлов из репозитория. Выберите нужный компонент утилиты Kingston urDrive для прямой загрузки с серверов GitHub.</p>
    
    <ul id="files" class="file-list">
        <li class="status">Получение манифеста файлов...</li>
    </ul>
</div>

<script>
    // НАСТРОЙКА: Укажите ваш логин GitHub и имя репозитория, откуда нужно брать файлы
    const USER = 'elsan97'; 
    const REPO = 'kingston-urdrive'; // Сюда впишите имя репозитория с софтом (например, kingston-urdrive)
    const PATH = ''; // Если файлы в корне, оставьте пустым. Если в папке, укажите её, например 'urDrive'

    const filesContainer = document.getElementById('files');

    // Функция перевода байт в читаемый вид
    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function loadFiles() {
        try {
            const response = await fetch(`https://github.com{USER}/${REPO}/contents/${PATH}`);
            if (!response.ok) throw new Error('Не удалось получить список файлов');
            
            const items = await response.json();
            filesContainer.innerHTML = ''; // Очищаем статус загрузки

            // Фильтруем, убирая скрытые файлы git и папки (если нужны только файлы для скачивания)
            const files = items.filter(item => item.type === 'file' && !item.name.startsWith('.'));

            if (files.length === 0) {
                filesContainer.innerHTML = '<li class="status">В репозитории нет доступных файлов.</li>';
                return;
            }

            files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';

                li.innerHTML = `
                    <div class="file-info">
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">Размер: ${formatBytes(file.size)}</span>
                    </div>
                    <a href="${file.download_url}" class="download-btn" download>Скачать</a>
                `;
                filesContainer.appendChild(li);
            });

        } catch (error) {
            filesContainer.innerHTML = `<li class="status" style="color: #ff3333;">Ошибка: ${error.message}</li>`;
        }
    }

    loadFiles();
</script>

</body>
</html>
